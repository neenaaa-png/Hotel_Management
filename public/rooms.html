<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="Sunrise Hotel - Manage Rooms"
  >

  <title>Sunrise Hotel - Rooms</title>

  <link rel="stylesheet" href="/styles.css">
</head>

<body>

  <div class="container">

    <!-- Navigation -->
    <nav class="topnav">

      <div class="nav-inner">

        <div class="nav-left">
        </div>

        <ul class="nav-centre">

          <li>
            <a href="/">Home</a>
          </li>

          <li>
            <a href="/rooms.html">Rooms</a>
          </li>

          <li>
            <a href="/create.html">Create Room</a>
          </li>
          
          <li>
            <a href="/guests.html">Guests</a>
        </li>

          <li>
            <a href="/bookings.html">Bookings</a>
          </li>

        </ul>

        <div class="nav-right">
          <a
            href="/create.html"
            class="btn-link"
          >
            + Add Room
          </a>
        </div>

      </div>

    </nav>


    <!-- Main -->
    <main>

      <section class="card">

        <div class="page-header">

          <div>

            <p class="eyebrow">
              SUNRISE HOTEL
            </p>

            <h1>
              Rooms
            </h1>

            <p class="lead">
              View and manage all available hotel rooms.
            </p>

          </div>

          <a
            href="/create.html"
            class="btn-primary"
          >
            + Create Room
          </a>

        </div>


        <!-- Rooms Table -->
        <div class="table-responsive">

          <table id="roomsTable">

            <thead>

              <tr>
                <th>Photo</th>
                <th>Name</th>
                <th>Type</th>
                <th>Price</th>
                <th>Actions</th>
              </tr>

            </thead>

            <tbody></tbody>

          </table>

        </div>

      </section>

    </main>


    <!-- Footer -->
    <footer class="card">

      Sunrise Hotel • Room Management • AWS EC2 + DynamoDB

    </footer>

  </div>


  <script>

    async function loadRooms() {

      let items = null;


      try {

        const res =
          await fetch('/api/rooms');


        if (!res.ok) {
          throw new Error('API request failed');
        }


        items = await res.json();


      } catch (err) {

        console.warn(
          'Rooms API fetch failed, using demo data',
          err
        );

        items = demoRooms();

      }


      const tbody =
        document.querySelector(
          '#roomsTable tbody'
        );


      tbody.innerHTML = '';


      if (!items || items.length === 0) {
        items = demoRooms();
      }


      items.forEach((r, i) => {

        const fallback =
          demoRooms()[i % 4].image;


        const img =
          r.image || fallback;


        const tr =
          document.createElement('tr');


        tr.innerHTML = `

          <td data-label="Photo">

            <img
              src="${img}"
              alt="${r.name || 'room'}"
              class="room-photo"
              onerror="this.src='${fallback}'"
            >

          </td>


          <td data-label="Name">

            <strong>
              ${r.name || ''}
            </strong>

            <div class="room-id">
              ID: ${r.id || '—'}
            </div>

          </td>


          <td data-label="Type">

            <span class="room-type">
              ${r.type || ''}
            </span>

          </td>


          <td data-label="Price">

            <strong>
              ₹${r.price || ''}
            </strong>

            <span class="price-label">
              / night
            </span>

          </td>


          <td data-label="Actions">

            <a
              href="/edit.html?id=${r.id}"
              class="action-edit"
            >
              Edit
            </a>

            <button
              type="button"
              class="action-delete"
              onclick="del('${r.id}')"
            >
              Delete
            </button>

          </td>

        `;


        tbody.appendChild(tr);

      });

    }


    async function del(id) {

      if (
        !confirm(
          'Are you sure you want to delete this room?'
        )
      ) {
        return;
      }


      try {

        const res =
          await fetch(
            '/api/rooms/' + id,
            {
              method: 'DELETE'
            }
          );


        if (!res.ok) {
          throw new Error('Delete failed');
        }


        loadRooms();


      } catch (err) {

        console.error(err);

        alert(
          'Unable to delete the room.'
        );

      }

    }


    function demoRooms() {

      return [

        {
          id: 'demo-1',
          name: 'Room 101',
          type: 'Single',
          price: 50,
          image: '/assets/room1.svg'
        },

        {
          id: 'demo-2',
          name: 'Room 102',
          type: 'Double',
          price: 80,
          image: '/assets/room2.svg'
        },

        {
          id: 'demo-3',
          name: 'Suite 201',
          type: 'Suite',
          price: 180,
          image: '/assets/room3.svg'
        },

        {
          id: 'demo-4',
          name: 'Family 301',
          type: 'Family',
          price: 140,
          image: '/assets/room4.svg'
        }

      ];

    }


    loadRooms();

  </script>

</body>
</html>
